const KIND = {
  water:{p:tz=>tz<=9?0.40:0.55, pick:r=>"wave"},
  forest:{p:tz=>tz<=9?0.35:tz<=11?0.55:0.85, pick:r=>r<0.62?"pine":"tree"},
  mountain:{p:tz=>tz<=11?0.50:0.70, pick:(r,tz)=>tz<=11?"mountain":(r<0.25?"mountain":"pine")},
  farm:{p:tz=>tz<=9?0.15:0.40, pick:r=>r<0.14?"barn":"tree"}
};

function inZone(zn,lat,lng){
  if(zn.t==="e"){const a=(lat-zn.lat)/zn.rl,b=(lng-zn.lng)/zn.rg;return a*a+b*b<=1;}
  const x=lng*0.66,y=lat;
  for(let i=1;i<zn.pts.length;i++){
    const ax=zn.pts[i-1][1]*0.66,ay=zn.pts[i-1][0],bx=zn.pts[i][1]*0.66,by=zn.pts[i][0];
    const dx=bx-ax,dy=by-ay;
    const t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy||1)));
    const px=ax+dx*t-x,py=ay+dy*t-y;
    if(px*px+py*py<=zn.w*zn.w) return true;
  }
  return false;
}
function hash(a,b,c){
  let h=Math.imul(a|0,374761393)^Math.imul(b|0,668265263)^Math.imul(c|0,2246822519);
  h=Math.imul(h^(h>>>15),2246822519);
  h=Math.imul(h^(h>>>13),3266489917);
  h^=h>>>16;
  return (h>>>0)/4294967296;
}
// one doodle per grid cell, grid gets finer as you zoom in so it always looks evenly filled
function genDecor(bounds,tz){
  const sp=0.13/Math.pow(2,tz-9), spx=sp/0.66;
  const sw=bounds.getSouthWest(), ne=bounds.getNorthEast();
  const padLat=(ne.lat()-sw.lat())*0.2, padLng=(ne.lng()-sw.lng())*0.2;
  const S=sw.lat()-padLat,N=ne.lat()+padLat,W=sw.lng()-padLng,E_=ne.lng()+padLng;
  const out=[];
  for(let cy=Math.floor(S/sp);cy<=Math.floor(N/sp);cy++){
    for(let cx=Math.floor(W/spx);cx<=Math.floor(E_/spx);cx++){
      const lat=(cy+hash(cx,cy,tz*3+1))*sp, lng=(cx+hash(cx,cy,tz*3+2))*spx;
      let zone=null;
      for(const zn of ZONES){ if(inZone(zn,lat,lng)){zone=zn;break;} }
      if(!zone) continue;
      const k=KIND[zone.kind], r=hash(cx,cy,tz*3+3);
      if(hash(cy,cx,tz*3+4)>k.p(tz)) continue;
      out.push({lat,lng,icon:k.pick(r,tz)});
    }
  }
  return out.slice(0,700);
}

const sizeScale = z => Math.min(1.4, Math.max(0.45, 0.45 + (z-9)*0.1));
const scaleFor  = z => Math.min(1.35, Math.max(0.35, 1 + (z-16)*0.22));

/* ---------- map style: zoom-aware ---------- */
function buildStyle(z){
  const w = z<=11?0.5 : z<=12?0.7 : z<=13?0.9 : z<=14?1.2 : z<=15?1.8 : z<=16?2.4 : z<=17?2.8 : 3.2;
  const st = [
    {elementType:"geometry",stylers:[{color:"#ffffff"}]},
    {elementType:"labels",stylers:[{visibility:"off"}]},
    {featureType:"poi",stylers:[{visibility:"off"}]},
    {featureType:"transit",stylers:[{visibility:"off"}]},
    {featureType:"administrative",stylers:[{visibility:"off"}]},
    {featureType:"landscape",stylers:[{color:"#ffffff"}]},
    {featureType:"water",stylers:[{color:"#e8e8e8"}]}   // light grey so the coastline reads
  ];
  ["road.highway","road.arterial","road.local"].forEach(t=>{
    const vis = t==="road.local" ? z>=17 : t==="road.arterial" ? z>=13 : true;
    st.push({featureType:t,stylers:[{visibility:vis?"on":"off"}]});
    if(vis){
      const ww = t==="road.local" ? w*0.7 : w;
      st.push({featureType:t,elementType:"geometry.fill",stylers:[{color:"#ffffff"}]});
      st.push({featureType:t,elementType:"geometry.stroke",stylers:[{color:"#000000"},{weight:ww}]});
    }
  });
  st.push({featureType:"road",elementType:"labels",stylers:[{visibility:"off"}]});
  return st;
}

/* ---------- overlays ---------- */
let DecorLayer, PlaceLayer, StreetLayer;
function defineClasses(){
  DecorLayer = class extends google.maps.OverlayView {
    constructor(map){super();this.map_=map;this.items=[];}
    onAdd(){this.box=document.createElement("div");this.getPanes().overlayLayer.appendChild(this.box);}
    refresh(){
      const b=this.map_.getBounds(); if(!b||!this.box) return;
      const tz=Math.round(this.map_.getZoom());
      this.items=genDecor(b,tz);
      this.box.innerHTML=this.items.map(it=>`<div class="dc">${ICONS[it.icon]}</div>`).join("");
      this.draw();
    }
    draw(){
      const proj=this.getProjection(); if(!proj||!this.box) return;
      const sc=sizeScale(this.map_.getZoom()), kids=this.box.children;
      for(let i=0;i<this.items.length;i++){
        const it=this.items[i], p=proj.fromLatLngToDivPixel(new google.maps.LatLng(it.lat,it.lng));
        kids[i].style.left=p.x+"px";kids[i].style.top=p.y+"px";
        kids[i].style.transform=`translate(-50%,-50%) scale(${sc})`;
      }
    }
    onRemove(){this.box.remove();}
  };

  PlaceLayer = class extends google.maps.OverlayView {
    constructor(map,data){super();this.map_=map;this.data=data;this.els=[];}
    onAdd(){
      this.box=document.createElement("div");
      this.getPanes().overlayLayer.appendChild(this.box);
      this.els=this.data.map(d=>{
        const el=document.createElement("div");
        el.className="lm";
        el.innerHTML=ICONS[d[3]]+(d[0]?`<span>${d[0]}</span>`:"");
        this.box.appendChild(el);
        return el;
      });
    }
    draw(){
      const proj=this.getProjection(); if(!proj||!this.box) return;
      const z=this.map_.getZoom(), sc=sizeScale(z);
      this.data.forEach((d,i)=>{
        const el=this.els[i], show=z>=d[4]&&z<=(d[5]||99);
        el.style.display=show?"":"none";
        if(!show) return;
        const p=proj.fromLatLngToDivPixel(new google.maps.LatLng(d[1],d[2]));
        el.style.left=p.x+"px";el.style.top=p.y+"px";
        el.style.transform=`translate(-50%,-50%) scale(${sc})`;
      });
    }
    onRemove(){this.box.remove();}
  };

  // live street names (OpenStreetMap), drawn along the real streets in the hand-drawn font
  StreetLayer = class extends google.maps.OverlayView {
    constructor(map){super();this.map_=map;this.items=[];this.pending=null;}
    onAdd(){
      this.box=document.createElement("div");
      this.getPanes().overlayLayer.appendChild(this.box);
      if(this.pending) this.setItems(this.pending);
    }
    setItems(list){
      if(!this.box){this.pending=list;return;}
      this.box.innerHTML="";
      this.items=list.map(it=>{
        const el=document.createElement("div");
        el.className="st";el.textContent=it.name;
        this.box.appendChild(el);
        return Object.assign({el},it);
      });
      this.draw();
    }
    draw(){
      const proj=this.getProjection();
      if(!proj||!this.items.length) return;
      const sc=scaleFor(this.map_.getZoom());
      for(const it of this.items){
        const p=proj.fromLatLngToDivPixel(new google.maps.LatLng(it.lat,it.lng));
        it.el.style.left=p.x+"px";it.el.style.top=p.y+"px";
        it.el.style.transform=`translate(-50%,-50%) rotate(${it.angle}deg) scale(${sc})`;
      }
    }
    onRemove(){this.box.remove();}
  };
}

function initMap(){
  defineClasses();
  const map=new google.maps.Map(document.getElementById("map"),{
    center:{lat:49.2700,lng:-123.1000},zoom:11,minZoom:9,maxZoom:19,
    styles:buildStyle(11),disableDefaultUI:true,zoomControl:true,gestureHandling:"greedy",
    backgroundColor:"#ffffff"
  });
  if(WOBBLE) document.getElementById("map").style.filter="url(#wobble)";

  const decor=new DecorLayer(map); decor.setMap(map);          // trees, mountains, waves (bottom)
  const streetLayer=new StreetLayer(map); streetLayer.setMap(map);
  const places=new PlaceLayer(map,PLACES); places.setMap(map); // named landmarks (top)

  let lastZ=11;
  map.addListener("zoom_changed",()=>{
    const z=Math.round(map.getZoom());
    if(z!==lastZ){lastZ=z;map.setOptions({styles:buildStyle(z)});}
  });

  // ---- live street names ----
  let ways=[], fetched=null, ctrl=null;

  function place(){
    const z=Math.round(map.getZoom());
    if(z<16||!ways.length){streetLayer.setItems([]);return;}
    const proj=map.getProjection(), b=map.getBounds();
    if(!proj||!b) return;
    const k=Math.pow(2,z);
    const toPx=(lat,lng)=>{const p=proj.fromLatLngToPoint(new google.maps.LatLng(lat,lng));return {x:p.x*k,y:p.y*k};};
    const tl=toPx(b.getNorthEast().lat(),b.getSouthWest().lng());
    const br=toPx(b.getSouthWest().lat(),b.getNorthEast().lng());
    const inside=p=>p.x>=tl.x&&p.x<=br.x&&p.y>=tl.y&&p.y<=br.y;

    const best=new Map();
    for(const w of ways){
      const pts=w.geom.map(g=>toPx(g.lat,g.lon)).filter(inside);
      if(pts.length<2) continue;
      let len=0;
      for(let i=1;i<pts.length;i++) len+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
      const cur=best.get(w.name);
      if(cur&&cur.len>=len) continue;
      let half=len/2,x=pts[0].x,y=pts[0].y,ang=0;
      for(let i=1;i<pts.length;i++){
        const dx=pts[i].x-pts[i-1].x,dy=pts[i].y-pts[i-1].y,sl=Math.hypot(dx,dy);
        ang=Math.atan2(dy,dx)*180/Math.PI;
        if(half<=sl){const t=sl?half/sl:0;x=pts[i-1].x+dx*t;y=pts[i-1].y+dy*t;break;}
        half-=sl;x=pts[i].x;y=pts[i].y;
      }
      if(ang>90) ang-=180; if(ang<-90) ang+=180;
      best.set(w.name,{name:w.name,len,x,y,angle:ang});
    }

    const sc=scaleFor(z), placed=[], out=[];
    const cands=[...best.values()].sort((a,b)=>b.len-a.len);
    for(const c of cands){
      const lw=c.name.length*11*sc+12, lh=22*sc;
      if(c.len<lw*0.85) continue;
      const r=c.angle*Math.PI/180;
      const bw=Math.abs(lw*Math.cos(r))+Math.abs(lh*Math.sin(r));
      const bh=Math.abs(lw*Math.sin(r))+Math.abs(lh*Math.cos(r));
      if(placed.some(p=>Math.abs(p.x-c.x)<(p.w+bw)/2&&Math.abs(p.y-c.y)<(p.h+bh)/2)) continue;
      placed.push({x:c.x,y:c.y,w:bw,h:bh});
      const ll=proj.fromPointToLatLng(new google.maps.Point(c.x/k,c.y/k));
      out.push({name:c.name,lat:ll.lat(),lng:ll.lng(),angle:c.angle});
    }
    streetLayer.setItems(out);
  }

  async function load(){
    const z=Math.round(map.getZoom()), b=map.getBounds();
    if(z<16||!b) return;
    const ne=b.getNorthEast(), sw=b.getSouthWest();
    if(fetched&&fetched.contains(ne)&&fetched.contains(sw)) return;
    const dlat=(ne.lat()-sw.lat())*0.4, dlng=(ne.lng()-sw.lng())*0.4;
    const S=sw.lat()-dlat, W=sw.lng()-dlng, N=ne.lat()+dlat, E_=ne.lng()+dlng;
    const q=`[out:json][timeout:25];way["highway"~"^(motorway|trunk|primary|secondary|tertiary|residential|unclassified|living_street|pedestrian)$"]["name"](${S},${W},${N},${E_});out geom;`;
    if(ctrl) ctrl.abort();
    ctrl=new AbortController();
    try{
      const r=await fetch("https://overpass-api.de/api/interpreter",{
        method:"POST",body:"data="+encodeURIComponent(q),
        headers:{"Content-Type":"application/x-www-form-urlencoded"},signal:ctrl.signal});
      if(!r.ok) throw new Error("overpass "+r.status);
      const j=await r.json();
      ways=j.elements.filter(e=>e.geometry&&e.tags&&e.tags.name).map(e=>({name:e.tags.name,geom:e.geometry}));
      fetched=new google.maps.LatLngBounds({lat:S,lng:W},{lat:N,lng:E_});
    }catch(e){
      if(e.name==="AbortError") return;
    }
    place();
  }

  map.addListener("idle",()=>{decor.refresh();place();load();});
}
window.initMap=initMap;
function showMsg(t){
  const d=document.createElement("div");
  d.style.cssText="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font:18px 'Patrick Hand SC',sans-serif;color:#000;background:#fff;z-index:99";
  d.textContent=t;document.body.appendChild(d);
}
window.gm_authFailure=()=>showMsg("Google rejected the API key. Check: key is correct, Maps JavaScript API is enabled, billing is on, and the key's HTTP referrer restrictions allow this page.");
window.addEventListener("error",e=>showMsg("JS error: "+e.message));
const s=document.createElement("script");
s.src=`https://maps.googleapis.com/maps/api/js?key=${API_KEY}&callback=initMap&loading=async`;
document.head.appendChild(s);
</script>
